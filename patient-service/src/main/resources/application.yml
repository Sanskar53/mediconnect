server:
  port: 8082

spring:
  application:
    name: patient-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/mediconnect_patients

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.mediconnect: DEBUG

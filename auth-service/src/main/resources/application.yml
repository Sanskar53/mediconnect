server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/mediconnect_auth
      # For production (MongoDB Atlas), replace with:
      # uri: mongodb+srv://<username>:<password>@cluster.mongodb.net/mediconnect_auth

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: bWVkaWNvbm5lY3Qtc2VjcmV0LWtleS1mb3ItaGVhbHRoY2FyZS1wbGF0Zm9ybQ==
  expiration: 86400000        # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

logging:
  level:
    com.mediconnect: DEBUG

server:
  port: 8085
spring:
  application:
    name: prescription-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/mediconnect_prescriptions
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
logging:
  level:
    com.mediconnect: DEBUG

server:
  port: 8086

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/mediconnect_notifications

  # Email (SMTP) configuration using Gmail
  # Replace with your Gmail address and App Password
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com        # <-- Replace this
    password: your-app-password           # <-- Replace with Gmail App Password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.mediconnect: DEBUG
